<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小丑牌 - 同花色翻倍</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 构建阶段页面 -->
    <div id="build-page" class="game-page">
        <h2>构建阶段</h2>
        <div class="gold-display">资金: <span id="gold-count">12</span></div>

        <!-- 牌包区域 -->
        <div class="build-section">
            <h3>牌包</h3>
            <div id="packs-container" class="cards-row"></div>
        </div>

        <!-- 揭示的牌 -->
        <div class="build-section">
            <h3>揭示的牌</h3>
            <div id="revealed-cards-container" class="cards-row"></div>
        </div>

        <button class="btn-primary continue-btn" onclick="startGamePhase()">开始游戏</button>
    </div>

    <!-- 对齐阶段页面 -->
    <div id="align-page" class="game-page hidden">
        <h2>对齐阶段</h2>
        <div class="gold-display">资金: <span id="align-gold-count">12</span></div>

        <div class="player-info" id="player-info"></div>
        <div class="participant-probs" id="participant-probs"></div>

        <div class="build-section">
            <h3>可投票的牌</h3>
            <div id="align-hand-container" class="cards-row"></div>
        </div>

        <div id="align-buttons" class="action-buttons"></div>
    </div>

    <!-- 进行阶段页面 -->
    <div id="playing-page" class="game-page hidden">
        <div class="info-bar">
            <div class="info-item">当前分数: <span id="current-score">0</span></div>
            <div class="info-item">翻倍倍数: <span class="score-multiplier" id="multiplier">x1</span></div>
            <div class="info-item">剩余出牌: <span id="plays-left">4</span>次</div>
            <div class="info-item">剩余牌数: <span id="cards-left">12</span></div>
            <div class="info-item suit-count">
                <span class="suit-hearts" title="红桃">♥ <span id="count-hearts">0</span></span>
                <span class="suit-diamonds" title="方块">♦ <span id="count-diamonds">0</span></span>
                <span class="suit-clubs" title="梅花">♣ <span id="count-clubs">0</span></span>
                <span class="suit-spades" title="黑桃">♠ <span id="count-spades">0</span></span>
            </div>
        </div>

        <div class="game-area">
            <div class="card-row" id="table-row">
                <div class="row-header">
                    <div class="row-label">桌面牌（自动合并同花色计算）</div>
                </div>
            </div>

            <div class="card-row" id="hand-row">
                <div class="row-header">
                    <div class="row-label">手牌（点击选择要打出的牌，自动补牌）</div>
                </div>
            </div>

            <div class="buttons" id="action-buttons">
                <button class="btn-primary" onclick="playCards()">打出选中的牌</button>
                <button class="btn-secondary" id="btn-clear" onclick="clearSelected()">取消选择</button>
                <button class="btn-suggest" id="btn-suggest" onclick="suggestBestCards()" style="display: none;">推荐出牌</button>
                <button class="btn-secondary" onclick="resetGame()">重新开始</button>
            </div>

            <div class="message" id="message"></div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
